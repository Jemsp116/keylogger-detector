name: lint & test

on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install psutil pytest flake8
      - name: Lint
        run: flake8 keylogger_detector.py build.py tests/
      - name: Test
        run: python -m pytest tests/ -q
